services:
  postgres:
    image: postgres:16-alpine
    container_name: keyscanner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyscanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyscanner_password}
      POSTGRES_DB: ${POSTGRES_DB:-keyscanner_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyscanner_user} -d ${POSTGRES_DB:-keyscanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - keyscanner_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: keyscanner_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-keyscanner_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-keyscanner_password}
      - POSTGRES_DB=${POSTGRES_DB:-keyscanner_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-keyscanner_user}:${POSTGRES_PASSWORD:-keyscanner_password}@postgres:5432/${POSTGRES_DB:-keyscanner_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-keyscanner_user}:${POSTGRES_PASSWORD:-keyscanner_password}@postgres:5432/${POSTGRES_DB:-keyscanner_db}
      - SECRET_KEY=${SECRET_KEY:-secret_key_keyscanner_dev_only_change_in_production_min32chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENVIRONMENT=production
      - APP_NAME=KeyScanner
      - API_V1_STR=/api/v1
      - TEMP_SCANS_BASE_DIR=/app/temp_scans
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - temp_scans_data:/app/temp_scans
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keyscanner_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keyscanner_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - keyscanner_net

volumes:
  postgres_data:
    driver: local
  temp_scans_data:
    driver: local

networks:
  keyscanner_net:
    driver: bridge
